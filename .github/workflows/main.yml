name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # Folder that contains settings.gradle.
  # Use "." if you uploaded the contents of AnalogClockApps to the repo root.
  # Use "AnalogClockApps" if you uploaded the folder itself.
  PROJECT_DIR: .

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The project has no Gradle wrapper, so install Gradle directly.
      # AGP 8.1.4 requires Gradle 8.0+.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
